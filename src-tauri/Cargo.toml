[package]
name = "codetrail"
version = "0.1.0"
description = "A local-first code reading graph editor."
authors = ["CodeTrail"]
edition = "2021"

[lib]
name = "codetrail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.2.0", features = [] }

[dependencies]
tauri = { version = "=2.5.1", features = [] }
tauri-plugin-dialog = "=2.2.2"
tauri-runtime = "=2.6.0"
tauri-runtime-wry = "=2.6.0"
tauri-utils = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
